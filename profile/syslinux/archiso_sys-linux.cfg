LABEL arch
TEXT HELP
Boot the Cathedral live medium on BIOS.
It starts the Cathedral live system for trying, installing or repairing.
ENDTEXT
MENU LABEL Cathedral live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% console=ttyS0,115200 console=tty0

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Cathedral live medium on BIOS with speakup screen reader.
It starts the Cathedral live system with speech feedback.
ENDTEXT
MENU LABEL Cathedral live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
