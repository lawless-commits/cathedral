# Settings for the local test VM (read by scripts/vm/create-vm.sh).
# Change a value here, then run create-vm.sh with --recreate to apply it.
VM_NAME=cathedral
RAM_MIB=2048        # decided 2026-11-18 (DECISIONS.md); Cathedral's target is 1024
CPUS=2
DISK_GB=20          # empty disk for the install test (milestone 3); sparse, so it starts small
FIRMWARE=uefi       # uefi or bios
IMAGES_DIR=/var/lib/libvirt/images
